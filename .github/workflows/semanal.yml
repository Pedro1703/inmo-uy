name: Oportunidades inmobiliarias

on:
  schedule:
    # 11:30 UTC = 08:30 en Uruguay (UTC-3). Domingos.
    - cron: "30 11 * * 0"
  workflow_dispatch:
    inputs:
      max_paginas:
        description: "Tope de páginas por búsqueda (vacío = corrida completa)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: inmo-uy
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # El scraping completo son ~1,8 h; el tope de GitHub es 6 h.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        # Playwright sólo hace falta para el radar de MercadoLibre, que es
        # manual: acá se instala todo lo demás.
        run: pip install requests pandas numpy statsmodels pyarrow

      - name: Recolectar InfoCasas
        run: |
          if [ -n "${{ github.event.inputs.max_paginas }}" ]; then
            python collect.py --max-paginas ${{ github.event.inputs.max_paginas }}
          else
            python collect.py
          fi

      - name: Normalizar y modelar
        run: |
          python clean.py
          python model.py

      - name: Construir el sitio
        run: python build_site.py

      - name: Enviar la alerta
        # Corre aunque algo anterior falle: preferimos un aviso de que se rompió
        # antes que un domingo en silencio.
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERTA_DESTINO: ${{ secrets.ALERTA_DESTINO }}
        run: python alerta.py

      - name: Commitear sitio e histórico
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/historico_ids.json || true
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Actualizar oportunidades [skip ci]"
            git push
          fi
